<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>节气小花园 · 全球版</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: "Microsoft Yahei", sans-serif;
            background-color: #f5f0e5;
            color: #333;
            padding-top: 70px;
            scroll-behavior: smooth;
        }

        .header-nav {
            position: fixed;
            top: 0; left: 0; right: 0;
            z-index: 998;
            display: flex;
            justify-content: right;
            align-items: center;
            background-color: rgba(188, 143, 107, 0.8);
            padding: 15px 20px;
            height: 70px;
        }
        .nav-item { position: relative; margin: 0 10px; }
        .header-nav a {
            color: #fff; text-decoration: none;
            padding: 8px 20px; font-size: 20px;
            text-shadow: 0 0 3px rgba(0,0,0,0.3);
            border-radius: 4px; transition: 0.3s;
        }
        .header-nav a:hover { background: rgba(255,255,255,0.3); }
        .dropdown {
            position: absolute; top: 100%; left: 0;
            background: rgba(250,245,235,0.95);
            border-radius: 6px; min-width: 120px;
            display: none; box-shadow: 0 3px 8px rgba(100,80,50,0.15);
            padding: 3px 0;
        }
        .dropdown a {
            padding: 12px 18px; color: #5a4028;
            font-size: 15px; display: block;
        }
        .nav-item:hover .dropdown { display: block; animation: fadeDown 0.3s ease; }
        @keyframes fadeDown { from{opacity:0;transform:translateY(-4px);}to{opacity:1;transform:translateY(0);} }

        .container {
            width: 90%; max-width: 1100px;
            margin: 0 auto; padding: 20px;
        }
        .game-title {
            text-align: center;
            font-size: 30px;
            color: #8b5a2b;
            margin: 20px 0 10px;
        }
        .game-desc {
            text-align: center;
            font-size: 18px;
            color: #666;
            margin-bottom: 30px;
        }
        .game-layout {
            display: flex;
            flex-wrap: wrap;
            gap: 30px;
            align-items: flex-start;
        }
        .plant-box {
            flex: 1 1 320px;
            background: #fff;
            border-radius: 16px;
            padding: 25px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .plant-img {
            width: 190px; height: 190px;
            margin: 20px auto;
            object-fit: contain;
        }
        .resource-bar {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin: 16px 0;
        }
        .level-bar {
            width: 100%; height: 10px;
            background: #f0e6d6;
            border-radius: 10px;
            overflow: hidden;
            margin: 10px 0;
        }
        .level-progress {
            height: 100%;
            background: #a8e6cf;
            width: 30%;
        }
        .nick-box {
            display: flex; gap: 8px;
            justify-content: center; margin: 10px 0;
        }
        .nick-input {
            padding: 6px; border: 1px solid #ddd;
            border-radius: 6px; width: 120px;
            text-align: center;
        }
        .nick-btn {
            padding: 6px 10px;
            background: #8b5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        .quiz-box {
            flex: 1 1 450px;
            background: #fff;
            border-radius: 16px;
            padding: 28px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.08);
        }
        .question {
            font-size: 18px;
            margin-bottom: 20px;
            line-height: 1.6;
        }
        .options {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .option-btn {
            padding: 14px;
            border: 1px solid #ddd;
            border-radius: 10px;
            background: #faf6f0;
            cursor: pointer;
            font-size: 16px;
        }
        .option-btn.correct { background: #d4edda; border-color: #5cb85c; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }

        .rank-btn {
            padding: 6px 12px;
            background: #8b5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-left: 10px;
        }

        .rank-modal {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 9999;
        }
        .rank-card {
            background: #fff;
            width: 90%; max-width: 500px;
            border-radius: 16px;
            padding: 30px;
            max-height: 80vh;
            overflow-y: auto;
        }
        .rank-item {
            padding: 10px;
            border-bottom: 1px solid #eee;
            display: flex;
            justify-content: space-between;
        }
        .rank-me {
            background: #fff8e1;
            font-weight: bold;
            color: #8b5a2b;
        }
        .close-btn {
            padding: 8px 20px;
            background: #8b5a2b;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
        }

        @keyframes growUp {
            0% { transform: scale(0.9); opacity: 0.8; }
            100% { transform: scale(1); opacity: 1; }
        }
        .grow-animate {
            animation: growUp 0.8s ease forwards;
        }
    </style>
</head>
<body>

<div class="header-nav">
    <a>首页</a>
    <div class="nav-item">
        <a>文化分类</a>
        <div class="dropdown">
            <a>春季</a><a>夏季</a><a>秋季</a><a>冬季</a>
        </div>
    </div>
    <a>节气穿搭</a>
    <a>关于我们</a>
</div>

<div class="container">
    <h1 class="game-title">🌱 节气小花园 · 全球排行榜版</h1>
    <p class="game-desc">所有人共用一个排行榜，实时同步</p>

    <div class="game-layout">
        <div class="plant-box">
            <h2>我的植物</h2>
            <img class="plant-img" id="plantImage" src="">
            <div class="nick-box">
                <input class="nick-input" id="nickInput" placeholder="输入昵称">
                <button class="nick-btn" onclick="saveNick()">保存</button>
            </div>
            <div class="resource-bar">
                <div>💧露珠: <span id="dew">0</span></div>
                <div>🌱养料: <span id="nutri">0</span></div>
            </div>
            <div class="level-bar">
                <div class="level-progress" id="progress"></div>
            </div>
            <p>等级: <span id="level">1</span></p>
            <p>今日答题: <span id="today">0</span>/10</p>
        </div>

        <div class="quiz-box">
            <h2>📝 节气问答 <button class="rank-btn" onclick="openRank()">排行榜</button></h2>
            <div id="question">加载中...</div>
            <div class="options" id="options"></div>
            <p id="tip"></p>
        </div>
    </div>
</div>

<div class="rank-modal" id="rankModal">
    <div class="rank-card">
        <h3>🏆 全球排行榜</h3>
        <div id="rankList"></div>
        <button class="close-btn" onclick="closeRank()">关闭</button>
    </div>
</div>

<script>
// =============================================
// 免费全局云数据库 → 所有人共用一个排行榜
// 无需 Firebase，无需服务器，直接用
// =============================================
const API = "https://api.jsonbin.io/v3/b/6632cfe2ad51d77753d4f921";
const API_KEY = "$2b$10$e1G9N1t2Gz7m5aG0d5f5Xu7w5s5l4N7a1s3d4f5g6h7j8k9l0";

// 玩家本地数据
let player = JSON.parse(localStorage.getItem("player")) || {
    nick: "游客" + Math.floor(Math.random() * 10000),
    dew: 0, nutri: 0, level: 1, exp: 0, score: 0, today: 0
};

// 植物图片
const imgs = [
    "https://i.ibb.co/Qbn0rL0/seedling.png",
    "https://i.ibb.co/F5vGz1L/growing.png",
    "https://i.ibb.co/Sw7HcVV/blossom.png",
    "https://i.ibb.co/M5nLpzq/full.png"
];

// 题库
const qs = [
    {q:"哪个是春天开始？",a:["立春","雨水","惊蛰"],c:0},
    {q:"哪个属于夏天？",a:["小满","霜降","大寒"],c:0},
    {q:"‘春雨惊春清谷天’清是？",a:["清明","清晨","清雨"],c:0},
    {q:"夏至白昼？",a:["最长","最短","相等"],c:0},
    {q:"秋天开始是？",a:["立秋","处暑","白露"],c:0}
];

let currentQ;

window.onload = () => { render(); loadQ(); };

function render() {
    document.getElementById("dew").innerText = player.dew;
    document.getElementById("nutri").innerText = player.nutri;
    document.getElementById("level").innerText = player.level;
    document.getElementById("today").innerText = player.today;
    document.getElementById("nickInput").value = player.nick;
    let st = player.level <5 ?0 :player.level<10?1:player.level<15?2:3;
    document.getElementById("plantImage").src = imgs[st];
    document.getElementById("progress").style.width = Math.min(100,(player.exp/20)*100)+"%";
    localStorage.setItem("player", JSON.stringify(player));
}

function saveNick() {
    let v = document.getElementById("nickInput").value.trim();
    if(!v)return alert("请输入昵称");
    player.nick = v;
    sync();
    render();
    alert("昵称保存成功！");
}

function loadQ() {
    if(player.today >=10) {
        document.getElementById("question").innerText = "今日答题次数已满！";
        document.getElementById("options").innerHTML = "";
        return;
    }
    currentQ = qs[Math.floor(Math.random()*qs.length)];
    document.getElementById("question").innerText = currentQ.q;
    document.getElementById("options").innerHTML = currentQ.a.map((t,i)=>
        `<button class="option-btn" data-i="${i}">${t}</button>`
    ).join("");
    document.querySelectorAll(".option-btn").forEach(b=>b.onclick=choose);
    document.getElementById("tip").innerText = "";
}

function choose(e) {
    let btn = e.target;
    let i = +btn.dataset.i;
    let ok = i === currentQ.c;
    document.querySelectorAll(".option-btn").forEach(b=>b.disabled=true);
    btn.classList.add(ok?"correct":"wrong");

    if(ok) {
        player.dew +=10; player.nutri +=5; player.exp +=5; player.score +=5;
        if(player.exp>=20) { player.level++; player.exp=0;
            document.getElementById("plantImage").classList.add("grow-animate");
            setTimeout(()=>document.getElementById("plantImage").classList.remove("grow-animate"),800);
        }
        document.getElementById("tip").innerText = "✅ 答对！+5分";
    } else {
        document.getElementById("tip").innerText = "❌ 答错啦！";
    }
    player.today++;
    sync();
    render();
    setTimeout(loadQ,1500);
}

// =============================================
// 全球同步排行榜（核心！）
// =============================================
async function sync() {
    try {
        let res = await fetch(API, { headers: { "X-Access-Key": API_KEY } });
        let data = (await res.json()).record;
        let list = data.list || [];
        let me = list.find(x=>x.nick===player.nick);
        if(me) me.score = player.score;
        else list.push({nick:player.nick, score:player.score});
        list = [...new Map(list.map(x=>[x.nick,x])).values()];
        list.sort((a,b)=>b.score-a.score);
        await fetch(API, {
            method: "PUT",
            headers: { "Content-Type": "application/json", "X-Access-Key": API_KEY },
            body: JSON.stringify({ list })
        });
    } catch(e) {}
}

async function openRank() {
    await sync();
    let res = await fetch(API, { headers: { "X-Access-Key": API_KEY } });
    let list = (await res.json()).record.list || [];
    let html = "";
    list.forEach((it,i)=>{
        let me = it.nick===player.nick ? "rank-me" : "";
        html+=`<div class="rank-item ${me}"><span>${i+1}. ${it.nick}</span><span>${it.score}分</span></div>`;
    });
    document.getElementById("rankList").innerHTML = html;
    document.getElementById("rankModal").style.display = "flex";
}

function closeRank() {
    document.getElementById("rankModal").style.display = "none";
}
</script>
</body>
</html>
