        { id: "shoes2", name: "皮鞋", image: "皮鞋.png", seasons: ["all"] },
        { id: "shoes3", name: "凉鞋", image: "凉鞋.png", seasons: ["summer"] },
        { id: "shoes4", name: "靴子", image: "靴子.png", seasons: ["autumn", "winter"] },
        { id: "shoes5", name: "帆布鞋", image: "帆布鞋.png", seasons: ["spring", "summer"] },
        { id: "shoes6", name: "棉鞋", image: "棉鞋.png", seasons: ["winter"] }
      ],
      accessory: [
        { id: "acc1", name: "帽子", image: "帽子.png", seasons: ["all"] },
        { id: "acc2", name: "围巾", image: "围巾.png", seasons: ["autumn", "winter"] },
        { id: "acc3", name: "太阳镜", image: "墨镜.png", seasons: ["summer"] },
        { id: "acc4", name: "手套", image: "手套.png", seasons: ["winter"] },
        { id: "acc5", name: "手表", image: "手表.png", seasons: ["all"] },
        { id: "acc6", name: "雨伞", image: "雨伞.png", seasons: ["spring", "summer"] }
      ]
    };
    
    // 当前状态
    let currentTerm = "春分";
    let currentSeason = "spring";
    let selectedClothes = {
      coat: null,
      top: null,
      shoes: null,
      accessory: null
    };
    let currentCategory = "coat";
    
    // DOM元素
    const termDropdownBtn = document.getElementById('termDropdownBtn');
    const termDropdown = document.getElementById('termDropdown');
    const currentTermEl = document.getElementById('currentTerm');
    const termDescriptionEl = document.getElementById('termDescription');
    const clothesList = document.getElementById('clothesList');
    const categoryBtns = document.querySelectorAll('.clothes-category-btn');
    const confirmBtn = document.getElementById('confirmBtn');
    const resetBtn = document.getElementById('resetBtn');
    const ratingModal = document.getElementById('ratingModal');
    const closeRatingBtn = document.getElementById('closeRatingBtn');
    const ratingStars = document.getElementById('ratingStars');
    const ratingComment = document.getElementById('ratingComment');
    const backBtn = document.getElementById('backBtn');
    
    // 初始化
    function init() {
      // 生成节气下拉菜单
      generateSolarTermsDropdown();
      
      // 显示初始服装
      renderClothesByCategory(currentCategory);
      
      // 添加事件监听
      addEventListeners();
	  
	  updateCharacterImage(currentTerm); // 加载默认节气（春分）的图片
    }
    
    // 生成节气下拉菜单
    function generateSolarTermsDropdown() {
      const dropdownContent = termDropdown.querySelector('div');
      dropdownContent.innerHTML = '';
      
      solarTerms.forEach(term => {
        const termEl = document.createElement('div');
        termEl.className = `solar-term-card p-2 rounded-lg text-center text-sm cursor-pointer ${term.season === 'spring' ? 'bg-green-50 text-green-800' : 
                                                                                     term.season === 'summer' ? 'bg-yellow-50 text-yellow-800' :
                                                                                     term.season === 'autumn' ? 'bg-orange-50 text-orange-800' :
                                                                                                                'bg-blue-50 text-blue-800'}`;
        termEl.innerHTML = `
          <div class="season-indicator ${term.season === 'spring' ? 'bg-green-500' : 
                                       term.season === 'summer' ? 'bg-yellow-500' :
                                       term.season === 'autumn' ? 'bg-orange-500' :
                                                                  'bg-blue-500'}"></div>
          ${term.name}
        `;
        
        termEl.addEventListener('click', () => {
          currentTerm = term.name;
          currentSeason = term.season;
          currentTermEl.textContent = currentTerm;
          termDescriptionEl.textContent = term.description;
          termDropdown.classList.add('hidden');
          
          // 更新季节指示器颜色
          const indicator = currentTermEl.nextElementSibling;
          indicator.className = `ml-2 h-4 w-4 rounded-full ${term.season === 'spring' ? 'bg-green-400' : 
                                                          term.season === 'summer' ? 'bg-yellow-400' :
                                                          term.season === 'autumn' ? 'bg-orange-400' :
                                                                                     'bg-blue-400'}`;
          
          // 重置服装选择
          resetClothes();
		  
		  // 新增：切换节气图片
		    updateCharacterImage(currentTerm);
        });
        
        dropdownContent.appendChild(termEl);
      });
    }
    
    // 根据类别渲染服装
    function renderClothesByCategory(category) {
      clothesList.innerHTML = '';
      
      clothesData[category].forEach(item => {
        const isSuitable = item.seasons.includes(currentSeason) || item.seasons.includes('all');
        
        const clothesEl = document.createElement('div');
        clothesEl.className = `clothes-item ${selectedClothes[category] === item.id ? 'clothes-item-selected' : ''}`;
        clothesEl.innerHTML = `
          <img src="${item.image}" alt="${item.name}" class="max-w-3/4 max-h-3/4 object-contain">
          ${!isSuitable ? '<div class="absolute top-1 right-1 w-5 h-5 bg-red-400 rounded-full flex items-center justify-center text-white text-xs"><i class="fa fa-times"></i></div>' : ''}
        `;
        
        clothesEl.addEventListener('click', () => {
          selectClothes(category, item.id);
        });
        
        clothesList.appendChild(clothesEl);
      });
    }
    
    // 选择服装
    function selectClothes(category, id) {
      // 更新选中状态
      selectedClothes[category] = id;
      
      // 重新渲染当前类别的服装以更新选中状态
      renderClothesByCategory(category);
      
      // // 更新角色上的服装
      // updateCharacterClothes(category, id);
      
      // 显示选择提示
      showCharacterStatus(`已选择${clothesData[category].find(item => item.id === id).name}`);
	  
	  updateSelectedClothesList();
    }
    
    // // 更新角色上的服装
    // function updateCharacterClothes(category, id) {
    //   const clothesItem = clothesData[category].find(item => item.id === id);
    //   const clothesImg = document.getElementById(`clothes-${category}`);
      
    //   if (clothesItem) {
    //     clothesImg.src = clothesItem.image;
    //     clothesImg.classList.remove('hidden');
    //     clothesImg.classList.add('clothes-change');
        
    //     // 移除动画类以便下次可以重新触发
    //     setTimeout(() => {
    //       clothesImg.classList.remove('clothes-change');
    //     }, 400);
    //   }
    // }
    
    // 重置服装选择
    function resetClothes() {
      selectedClothes = {
        coat: null,
        top: null,
        shoes: null,
        accessory: null
      };
      
      // // 清空角色上的服装
      // Object.keys(selectedClothes).forEach(category => {
      //   const clothesImg = document.getElementById(`clothes-${category}`);
      //   clothesImg.src = '';
      //   clothesImg.classList.add('hidden');
      // });
      
      // 重新渲染当前类别的服装
      renderClothesByCategory(currentCategory);
      
      // 显示提示
      showCharacterStatus(`请为我搭配适合${currentTerm}的服饰吧！`);
	  
	  // 新增：清空竖列展示
	    updateSelectedClothesList();
    }
	// 更新节气对应的角色图片
	function updateCharacterImage(termName) {
	  // 找到当前节气的完整数据
	  const currentSolarTerm = solarTerms.find(item => item.name === termName);
	  if (!currentSolarTerm) return; // 找不到则退出
	  
	  // 获取左侧角色基底的img元素
	  const characterBaseImg = document.querySelector('#characterBase img');
	  // 更新图片路径（添加切换动画）
	  characterBaseImg.classList.add('clothes-change');
	  characterBaseImg.src = currentSolarTerm.image;
	  
	  // 移除动画类，以便下次切换可重新触发
	  setTimeout(() => {
	    characterBaseImg.classList.remove('clothes-change');
	  }, 400);
	}
	
	// 更新左侧竖列的选中服装展示
	function updateSelectedClothesList() {
	  const listContainer = document.getElementById('selectedClothesList');
	  listContainer.innerHTML = ''; // 清空原有内容
	
	  // 按固定顺序（大衣→上装→鞋子→配饰）遍历选中的服装
	  const categories = ['coat', 'top', 'shoes', 'accessory'];
	  categories.forEach(category => {
	    const clothesId = selectedClothes[category];
	    if (!clothesId) return; // 该类别未选中则跳过
	
	    // 找到对应服装的信息
	    const clothesItem = clothesData[category].find(item => item.id === clothesId);
	    if (!clothesItem) return;
	
	    // 创建服装项元素
	    const itemEl = document.createElement('div');
	    itemEl.className = 'selected-clothes-item fade-in'; // 加淡入动画
	    itemEl.title = clothesItem.name; // 鼠标悬浮显示名称
	    itemEl.innerHTML = `
	      <img src="${clothesItem.image}" alt="${clothesItem.name}" class="selected-clothes-img">
	    `;
	
	    // 点击竖列项可取消选中（可选功能）
	    itemEl.addEventListener('click', () => {
	      selectedClothes[category] = null; // 取消选中
	      // // 同步更新角色身上的服装
	      // const clothesImg = document.getElementById(`clothes-${category}`);
	      // clothesImg.src = '';
	      // clothesImg.classList.add('hidden');
	      // 重新渲染服装列表和竖列
	      renderClothesByCategory(currentCategory);
	      updateSelectedClothesList();
	      // 提示取消选中
	      showCharacterStatus(`已取消选择${clothesItem.name}`);
	    });
	
	    listContainer.appendChild(itemEl);
	  });
	}
    
    // 显示角色状态提示
    function showCharacterStatus(text) {
      const statusEl = document.getElementById('characterStatus');
      statusEl.textContent = text;
      
      // 添加短暂的高亮效果
      statusEl.classList.add('bg-primary/80');
      setTimeout(() => {
        statusEl.classList.remove('bg-primary/80');
      }, 500);
    }
    
    // 计算搭配评分
    function calculateRating() {
      let score = 0;
      let totalPossible = 0;
      
      // 检查每个类别的服装是否适合当前季节
      Object.keys(selectedClothes).forEach(category => {
        const clothesId = selectedClothes[category];
        if (clothesId) {
          totalPossible += 1;
          const clothesItem = clothesData[category].find(item => item.id === clothesId);
          if (clothesItem.seasons.includes(currentSeason) || clothesItem.seasons.includes('all')) {
            score += 1;
          }
        }
      });
      
      // 如果没有选择任何服装
      if (totalPossible === 0) {
        return { score: 0, comment: "请至少选择一件服饰进行搭配哦！" };
      }
      
      // 计算评分（0-5星）
      const starRating = Math.round((score / totalPossible) * 5);
      
      // 根据评分生成评语
      let comment = "";
      switch(starRating) {
        case 5:
          comment = `太棒了！你的搭配非常适合${currentTerm}的天气和节气特点，完美！`;
          break;
        case 4:
          comment = `很不错！你的搭配很适合${currentTerm}，稍微调整一下会更完美。`;
          break;
        case 3:
          comment = `还可以！你的搭配基本适合${currentTerm}，但有些选择不太符合季节特点。`;
          break;
        case 2:
          comment = `需要改进哦！你的搭配不太适合${currentTerm}的气候特点。`;
          break;
        case 1:
        case 0:
          comment = `不太合适呢！请根据${currentTerm}的气候特点重新选择服饰吧。`;
          break;
      }
      
      return { score: starRating, comment };
    }
    
    // 显示评分弹窗
    function showRatingModal() {
      const rating = calculateRating();
      
      // 更新星星显示
      ratingStars.innerHTML = '';
      for (let i = 1; i <= 5; i++) {
        const star = document.createElement('i');
        star.className = `fa ${i <= rating.score ? 'fa-star' : 'fa-star-o'}`;
        ratingStars.appendChild(star);
      }
      
      // 更新评语
      ratingComment.textContent = rating.comment;
      
      // 显示弹窗
      ratingModal.classList.remove('hidden');
    }
    
    // 添加事件监听
    function addEventListeners() {
      // 节气下拉菜单切换
      termDropdownBtn.addEventListener('click', () => {
        termDropdown.classList.toggle('hidden');
      });
      
      // 点击其他地方关闭下拉菜单
      document.addEventListener('click', (e) => {
        if (!termDropdownBtn.contains(e.target) && !termDropdown.contains(e.target)) {
          termDropdown.classList.add('hidden');
        }
      });
      
      // 服装类别切换
      categoryBtns.forEach(btn => {
        btn.addEventListener('click', () => {
          // 更新按钮样式
          categoryBtns.forEach(b => {
            b.classList.remove('bg-primary', 'text-white');
            b.classList.add('bg-neutral-dark', 'text-gray-700');
          });
          btn.classList.remove('bg-neutral-dark', 'text-gray-700');
          btn.classList.add('bg-primary', 'text-white');
          
          // 切换类别并渲染
          currentCategory = btn.dataset.category;
          renderClothesByCategory(currentCategory);
        });
      });
      
      // 确认搭配按钮
      confirmBtn.addEventListener('click', showRatingModal);
      
      // 重置按钮
      resetBtn.addEventListener('click', resetClothes);
      
      // 关闭评分弹窗
      closeRatingBtn.addEventListener('click', () => {
        ratingModal.classList.add('hidden');
      });
      
      // 返回按钮
      backBtn.addEventListener('click', () => {
        alert('返回上一页（在实际应用中会跳转到之前的页面）');
      });
    }
    
    // 初始化游戏
    document.addEventListener('DOMContentLoaded', init);
  </script>
</body>
</html>
